<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
          crossorigin="anonymous">
  <link th:href="@{/css/recommend/recommend.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/searchdest/style2.css}">
  <link rel="stylesheet" th:href="@{/css/searchdest/searchdest.css}">
  <link rel="stylesheet" th:href="@{/css/searchdest/animate.css}">
  <link
          href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900"
          rel="stylesheet">
  <title>여행지 추천</title>
</head>

<body data-spy="scroll" data-target=".site-navbar-target" ata-offset="300">
<a name="header"></a>
<div th:replace="/common/navbar"></div>

<div class="container">

  <div class="recommend-header">
    <h2 class="recommend-title">
      <span class="recommend-heart">♥</span>
      <span th:text="${session.loginID}"></span>님을 위한 여행지 추천
    </h2>

    <p class="recommend-description">
      회원님이 <a th:href="@{/member/mypage}" class="recommend-like">♥ 찜한 여행지</a>를 바탕으로<br>
      취향이 비슷한 사용자 5명의 데이터를 분석해 추천해드려요.
    </p>
  </div>

  <th:block th:if="${response.mode.name() == 'HAS_RECOMMEND'}">
    <!--여행지 검색 결과-->
    <div>
        <div th:replace="searchdest/searchitem"></div>
    </div>
  </th:block>

  <th:block th:if="${response.mode.name() == 'NOT_LOGIN'}">
    <div class="recommend-empty">
      <div class="recommend-empty-icon">♡</div>
      <h3>로그인이 필요한 서비스예요</h3>
      <p>로그인하고 나에게 맞는 여행지를 추천받아 보세요.</p>

      <div class="recommend-empty-actions">
        <a th:href="@{/member/login}" class="recommend-action-primary">
          로그인하기
        </a>
        <button type="button" onclick="history.back()"
                class="recommend-action-secondary">
          뒤로가기
        </button>
      </div>
    </div>
  </th:block>

  <th:block th:if="${response.mode.name() == 'EMPTY_FAVORITE'}">
    <div class="recommend-empty">
      <div class="recommend-empty-icon">♡</div>
      <h3>아직 찜한 여행지가 없어요</h3>
      <p>
        마음에 드는 여행지를 1개 이상 찜해 주세요.<br>
        회원님의 취향을 바탕으로 여행지를 추천해드릴게요.
      </p>

      <div class="recommend-empty-actions">
        <a th:href="@{/searchdest}" class="recommend-action-primary">
          여행지 둘러보기
        </a>
      </div>
    </div>
  </th:block>

  <br>
  <div th:replace="/common/footer"></div>

  <div style="position: fixed; bottom: 50px; right: 100px;">
    <a href="#header"><img src="pic/top.png" width="64px"></a>
  </div>
</div>
</body>
</html>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
