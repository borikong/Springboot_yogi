<!DOCTYPE html>
<html>
<head>
    <title>여행은 요기조기-내용</title>
    <th:block th:replace="board/common :: commonHead"></th:block>
</head>
<body>
<div th:replace="/common/navbar"></div>
<!-- 본문 -->
<div class="board_wrap" style="position: relative; z-index: 1;">
    <div class="board_title">
        <strong>자유게시판</strong>
        <p>자유롭게 이용가능한 게시판입니다.</p>
    </div>
    <div class="board_view_wrap">
        <!-- 타이틀 아래 영역(리스트, 페이지, 버튼) -->
        <div class="board_view">
            <!-- 공지글 전체 영역 -->
            <div class="title" th:text="${board.title}"></div>
            <div class="info">
                <!-- 글 정보 -->
                <dl>
                    <dt>번호</dt>
                    <dd th:text="${board.no}"></dd>
                </dl>
                <dl>
                    <dt>작성자</dt>
                    <dd th:text="${board.writer}"></dd>
                </dl>
                <dl>
                    <dt>작성일</dt>
                    <dd th:text="${#dates.format(board.regdate, 'yyyy-MM-dd HH:mm')}"></dd>
                </dl>
                <dl>
                    <dt>조회</dt>
                    <dd th:text="${board.readcount}"></dd>
                </dl>
                <dl>
                    <dd>
                        <input type="hidden" name="no" th:value="${board.no}">
                        <input type="image" th:src="@{/pic/board/trash.png}" width="15" alt="삭제"
                               th:onclick="|location.href='@{/board/delete(no=${board.no})}'|">
                    </dd>
                </dl>
            </div>
            <div class="cont">
                <!-- 글 내용 -->
                <pre th:text="${board.content}"></pre>
            </div>
            <!-- 댓글 영역 -->
            <div class="comment_wrap"><h3>댓글</h3> <!-- 댓글 목록 -->
                <div th:each="vo : ${board.commentList}">
                    <form action="/comment/delete" method="post">
                        <input type="hidden" name="cno" id="cno" th:value="${vo.cno}">
                        <input type="hidden" name="boardNo" id="boardNo" th:value="${board.no}">
                        <div class="comment_list"> <!-- 댓글 1 -->
                            <div class="comment_item">
                                <div class="comment_info">
                                    <span class="comment_writer" th:text="${vo.cid}"></span>
                                    <span class="comment_date" th:text="${#dates.format(vo.regdate, 'yyyy-MM-dd HH:mm')}"></span>
                                </div>
                                <div class="comment_content"><span th:text="${vo.content}"></span></div>
                                <div class="comment_btn" th:if="${session.loginID ==vo.cid}">
                                    <button type="button"
                                            th:onclick="|toggleEditForm(${vo.cno})|">
                                        수정
                                    </button>
                                    <button type="submit">삭제</button>
                                </div>
                            </div>
                        </div>
                    </form>
                    <!-- 숨겨진 수정 폼 -->
                    <form action="/comment/edit" method="post">
                        <input type="hidden" name="cno" th:value="${vo.cno}">
                        <input type="hidden" name="board_no" th:value="${board.no}">
                        <input type="hidden" name="cid" th:value="${session.loginID}">
                        <div class="comment_edit_form" th:id="|editForm-${vo.cno}|" style="display:none; margin-top:10px;">
                            <textarea name="content" style="width:100%; height:80px;" th:text="${vo.content}" required></textarea>
                            <button type="submit"> 수정 </button>
                        </div>
                    </form>
                </div>
                <!-- 댓글 작성 -->
                <form action="/comment/add" method="post">
                    <div th:if="${errorMessage != null}" th:text="${errorMessage}" style="color: red;">
                    </div>
                    <input type="hidden" name="board_no" id="board_no" th:value="${board.no}">
                    <input type="hidden" name="cid" id="cid" th:value="${session.loginID}">
                    <div class="comment_write" th:if="${session.loginID !=null}">
                        <textarea name="content" placeholder="댓글을 입력해주세요." required></textarea>
                        <button type="submit">댓글달기</button>
                    </div>
                    <div class="comment_write" th:if="${session.loginID ==null}">
                            <textarea name="content" placeholder="로그인을 하여 댓글을 입력해주세요." disabled></textarea>
                    </div>
                </form>
            </div>
            <!-- 버튼 영역 -->
            <div class="bt_wrap">
                <input type="button" class="on" value="목록"
                       th:onclick="|location.href='@{/board/boardlist(page=${board.page}, searchType=${board.searchType}, keyword=${board.keyword})}'|">
                <input type="button" value="수정"
                       th:onclick="|location.href='@{/board/edit(page=${board.page}, searchType=${board.searchType}, keyword=${board.keyword}, no=${board.no})}'|">
            </div>
        </div>
        <br>
    </div>
    <div th:replace="/common/footer"></div>
    <script>
        function toggleEditForm(cno) {
            const form = document.getElementById("editForm-" + cno);
            form.style.display = (form.style.display === "none") ? "block" : "none";
        }
    </script>

</body>
</html>
